<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenWatt | IEX Procurement</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blue: { 50: '#eff6ff', 100: '#dbeafe', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-black min-h-screen">
    <header class="border-b border-neutral-200 bg-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded bg-black flex items-center justify-center text-white font-bold text-lg">GW</div>
                <div>
                    <span class="font-extrabold text-black tracking-tight text-lg">GreenWatt</span>
                    <span class="ml-2 text-xs font-semibold px-2 py-0.5 rounded bg-blue-50 text-blue-700 border border-blue-200">IEX Layer</span>
                </div>
            </div>
            <nav class="hidden md:flex space-x-4">
                <a href="#" class="px-3 py-2 text-sm font-medium text-blue-600 bg-blue-50 rounded-md">Dashboard</a>
                <a href="#" class="px-3 py-2 text-sm font-medium text-neutral-600 hover:text-black">LP Planner</a>
                <a href="#" class="px-3 py-2 text-sm font-medium text-neutral-600 hover:text-black">Trade Ledger</a>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="p-5 border border-neutral-200 rounded-lg shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Day's Weighted DAM</p>
                <p class="text-2xl font-black mt-1">₹4.62 <span class="text-sm font-normal text-neutral-500">/ kWh</span></p>
            </div>
            <div class="p-5 border border-neutral-200 rounded-lg shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-neutral-500">Projected Load</p>
                <p class="text-2xl font-black mt-1">18.42 <span class="text-sm font-normal text-neutral-500">MWh</span></p>
            </div>
            <div class="p-5 border border-blue-200 bg-blue-50 rounded-lg shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-blue-800">Est. Daily Savings</p>
                <p class="text-2xl font-black text-blue-600 mt-1">₹43,810</p>
            </div>
            <div class="p-5 border border-neutral-200 rounded-lg shadow-sm">
                <p class="text-xs font-semibold uppercase tracking-wider text-neutral-500">CO₂ Avoided</p>
                <p class="text-2xl font-black mt-1">3,420 <span class="text-sm font-normal text-neutral-500">kg</span></p>
            </div>
        </div>

        <div class="border border-neutral-200 rounded-lg p-6 shadow-sm">
            <h2 class="text-base font-bold mb-4">96-Block MCP Price Forecast (INR/kWh)</h2>
            <canvas id="forecastChart" height="80"></canvas>
        </div>
    </main>

    <script>
        const ctx = document.getElementById('forecastChart').getContext('2d');
        const labels = Array.from({length: 24}, (_, i) => `${i}:00`);
        const data = Array.from({length: 24}, () => 4 + Math.random() * 3);
        
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Predicted Price',
                    data: data,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    </script>
</body>
</html>
